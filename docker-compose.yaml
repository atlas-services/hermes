networks:
  symfony:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    ports:
      - 3307:3306
    environment:
      MYSQL_USER: symfony
      MYSQL_PASSWORD: secret
      MYSQL_DATABASE: symfony
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - symfony

  apache:
    build:
      context: ./docker/apache
      dockerfile: apache.dockerfile
    ports:
      - 8080:80 # Le 1er port est celui de l'hôte
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - php
    networks:
      - symfony

  php:
    build:
      context: ./docker/php
      dockerfile: php.dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${UID:-1000}
    volumes:
      - ./:/var/www/html
    networks:
      - symfony

  composer:
    build:
      context: ./docker/composer
      dockerfile: composer.dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${UID:-1000}
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    networks:
      - symfony
