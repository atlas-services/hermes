<VirtualHost *:80>
    DocumentRoot /var/www/html/public
  
    ServerName test-hermes.local
    ServerAdmin contact@atlas-services.fr

    ErrorLog /var/log/apache2/hermes-error-2.log
    CustomLog /var/log/apache2/hermes-access-2.log combined
    LogLevel warn

    <FilesMatch \.php$>
        # when using PHP-FPM as a unix socket
        ###SetHandler proxy:unix:/var/run/php/php8.3-fpm.sock|fcgi://dummy
        ###SetHandler proxy:fcgi://php:9000
        # when PHP-FPM is configured to use TCP
        ##SetHandler php-fpm
    </FilesMatch>

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>
